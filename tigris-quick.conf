#
# 'rc' file for the quick profile: everything the default tigris.conf runs
# except the filesystem scan, which is the only check that takes
# minutes (it walks every disk). A quick run finishes in about a
# minute on a machine whose full run takes three.
#
# Run it with:  sudo ./tigris -c tigris-quick.conf
# or, the same:  sudo ./tigris --profile quick
#
# This file is a copy of tigris.conf with one change (FILESYSTEM below), kept
# for those who used it with 3.3.0. Profiles are now short files in
# profiles/ read on top of the tigris.conf (--profile); tests/profile_check.sh
# holds this file to tigris.conf plus profiles/quick. Keep it in step with
# tigris.conf: copy that file over this one and flip the switch again.
#
# This file is preprocessed, and thus can *only* contain variable
# assignments and comments.
#
#------------------------------------------------------------------------
#
# Select checks to perform.  Specify 'N' (uppercase) for checks
# you don't want performed.
#
# Notice this does not affect which checks will be performed through
# the cron job (Tiger's cronrc file governs that, usually under
# /usr/local/etc/tigris or /etc/tigris), it only affects which
# checks will be performed when running the full security checks
# (i.e. 'tiger')
#
#
TigrisNoBuild=Y			# C files are corrupted (ouch.)
Tigris_Check_PASSWD=Y		# Fast
Tigris_Check_PASSWD_FORMAT=N     # Fast - not needed if on systems with pwck
Tigris_Check_PASSWD_SHADOW=Y	# Time varies on # of users
Tigris_Check_GROUP=Y		# Fast
Tigris_Check_ACCOUNTS=Y		# Time varies on # of users
Tigris_Check_ALIASES=Y		# Fast
Tigris_Check_CRON=Y		# Fast
Tigris_Check_EXPORTS=Y		# Fast
Tigris_Check_NFSD=Y		# Fast - NFS daemons against /etc/exports
Tigris_Check_SERVICES=Y		# Could be faster, not bad though
Tigris_Check_KNOWN=Y		# Fast
Tigris_Check_PERMS=Y		# Could be faster, not bad though
Tigris_Check_SIGNATURES=N	# Several minutes
Tigris_Check_FILESYSTEM=N	# Quick profile: no filesystem scan (it walks every disk;
				# set Y for the full run, which takes minutes)
Tigris_Check_ROOTDIR=Y           # Fast, only 2 checks
Tigris_Check_ROOT_ACCESS=Y       # Fast
Tigris_Check_PATH=Y		# Fast for just root... varies for all 
Tigris_Check_EMBEDDED=Y		# Several minutes
Tigris_Check_BACKUPS=Y           # Fast
Tigris_Check_LOGFILES=Y          # Fast
Tigris_Check_USERUMASK=Y         # Fast
Tigris_Check_SHELLS=Y            # Fast - idle sessions killed (TMOUT, autologout)
Tigris_Check_ETCISSUE=N		# Fast, needs to be customised
Tigris_Check_STRICTNW=Y		# Fast - stringent N/W server checks
Tigris_Check_LISTENING=Y		# Fast
Tigris_Check_SYSTEM=Y		# Depends on the specific system checks
Tigris_Check_RUNPROC=N		# Fast, needs to be customized per system
Tigris_Check_DELETED=N		# Depends on the number of processes on the
Tigris_Check_EXRC=N		# Depends on the size of the filesystem
Tigris_Check_ROOTKIT=Y		# Slow if chkrootkit is available
				# system

# The following checks might depend on the services installed in the
# system, these need to be adjusted as required per system
Tigris_Check_APACHE=N		# Fast
Tigris_Check_SSH=Y		# Fast
Tigris_Check_SENDMAIL=N		# Fast
Tigris_Check_NTP=Y 		# Fast
Tigris_Check_KERBEROS=Y	# Fast - Kerberos client config and keytab
Tigris_Check_LDAP=Y		# Fast - LDAP client and server config
Tigris_Check_PHP=Y		# Fast - php.ini hardening
Tigris_Check_SNMP=Y		# Fast - SNMP daemon communities
Tigris_Check_SQUID=Y		# Fast - Squid proxy access and secrets
Tigris_Check_PRINTERS=Y	# Fast - CUPS browsing, listen and URIs
Tigris_Check_IDS=Y		# Fast - IDS/IPS presence and blindness
Tigris_Check_COMPILERS=Y	# Fast - compilers and malware scanners
Tigris_Check_ANTIVIRUS=Y	# Fast - antivirus signatures judged
Tigris_Check_MAIL=Y		# Fast - Exim, Postfix and Dovecot config
Tigris_Check_CRYPTO=Y	# Fast - RNG config, key perms, entropy
Tigris_Check_INTEGRITY=Y	# Fast - integrity watcher config
Tigris_Check_SIP=Y		# Fast - System Integrity Protection (macOS only)
Tigris_Check_FILEVAULT=Y	# Fast - FileVault encryption (macOS only)
Tigris_Check_DOAS=Y		# Fast - doas rules and nopass (macOS only)
Tigris_Check_SOFTWARE=Y	# Fast - apps, brew Cellar, updates (macOS only)
Tigris_Check_LAUNCHD=Y	# Fast - LaunchDaemons and Agents (macOS only)

# OS specific checks
# You can comment them if they are not appropriate to your system but
# they will not run if you are running a different OS
# - Linux specific
Tigris_Check_PATCH=N             # Depends on your network connection
				# (if no timeout is fixed it might stall)
Tigris_Check_SINGLE=Y            # Fast
Tigris_Check_BOOT=Y              # Fast
Tigris_Check_RCUMASK=Y           # Fast
Tigris_Check_NEVERLOG=Y          # Fast
Tigris_Check_OS=Y                # Fast
# - Linux, HPUX and Solaris specific
Tigris_Check_NETWORKCONFIG=Y     # Fast
Tigris_Check_PROMISC=Y          # Fast - interfaces in promiscuous mode
Tigris_Check_SYSCTL=Y            # Fast - kernel, file system and IPv6 hardening settings
Tigris_Check_SYSTEMD=Y           # Fast - sandboxing of network-facing systemd services
Tigris_Check_FIREWALL=Y          # Fast - incoming traffic denied by default (nftables, iptables)
Tigris_Check_SECUREBOOT=Y        # Fast - Secure Boot on, and the kernel locked down under it
Tigris_Check_MAC=Y               # Fast - AppArmor or SELinux enforcing
Tigris_Check_AUDIT=Y             # Fast - auditd with rules, logs kept across reboots
Tigris_Check_ACCOUNTING=Y        # Fast - sysstat and snoopy collecting
Tigris_Check_TIMESYNC=Y          # Fast - one time daemon, and the clock synchronised
Tigris_Check_UPDATES=Y           # Fast - security updates waiting, automatic, reboot (offline)
Tigris_Check_REPOS=Y             # Fast - repos that stopped publishing (offline)
# How old a repository's newest index may be, in days, before
# check_repos reports it stopped publishing (upd007w). The same age
# judges unrefreshed lists (upd008w).
Tigris_Repos_MaxAge=90
Tigris_Check_SUDO=Y              # Fast - sudo rules without a password or with wildcards
Tigris_Check_PKG=Y               # Fast - package notices (FreeBSD updating, Solaris verify)
Tigris_Check_ACCOUNTING=Y        # Fast - process accounting (FreeBSD only)
Tigris_Check_INETD=Y             # Fast - super-server services (FreeBSD only)
Tigris_Check_PAM=Y               # Fast - password quality and lockout in PAM
Tigris_Check_UNITS=Y             # Fast - what enabled systemd services and timers run
Tigris_Check_STORAGE=Y           # Fast - /tmp and /dev/shm options, encryption, core dumps
Tigris_Check_CONTAINERS=Y        # Fast - Docker and Podman: socket, TCP API, running containers
Tigris_Check_CERTS=Y             # Fast - server certificates expired or expiring soon
Tigris_Check_REMOTELOG=Y         # Fast - logs forwarded off this host, or not
Tigris_Check_DNS=Y               # Fast - resolv.conf, and unbound/bind open to the world
Tigris_Check_DATABASES=Y         # Fast - MySQL, PostgreSQL and Redis configuration
Tigris_Check_NGINX=Y             # Fast - nginx configuration and TLS
Tigris_Check_PKGINTEGRITY=Y      # Installed files against the rpm, apk or pacman database
# - Debian specific checks:
Tigris_Deb_CheckMD5Sums=Y       
Tigris_Deb_NoPackFiles=Y
Tigris_Deb_StatOverride=Y       # Fast - files against dpkg-statoverride's modes and owners
# End of Debian-specific checks
# - HPUX specific
Tigris_Check_TRUSTED=N
# End of HPUX specific checks
# 
# Should reports with no info be sent on cron?
#
Tigris_Cron_SendOKReports=N
#
# How many reports should be kept for each check when run from the
# crontab?
#
TigrisCron_Log_Keep_Max=10
#
# Should reports be compared with a template? (if available)
# (Note: takes precedence over previous run check)
#
Tigris_Cron_Template=N
#
# Should reports be compared with previous runs? (if available)
#
Tigris_Cron_CheckPrev=Y
#
# Should messages tagged with INFO be shown?
#
Tigris_Show_INFO_Msgs=N
#
# In order for this to be effective, you should define 'CRACK' in
# a 'site' file.
#
# Note: Disabled for Debian since it (currently) does not work and 
# the 'john' package can be configured to crack the passwords periodicly 
Tigris_Run_CRACK=N               # First time, ages; subsequent fairly quick
#
# Custom Crack binary location (like read-only media),
# this can be a generic location which can be overriden by the site
# configuration file.
#Tigris_CRACK_LOC_OVERRIDE=/mnt/cdrom/crack/Crack
#Tigris_CRACKREPORTER_LOC_OVERRIDE=/mnt/cdrom/crack/Reporter
# This directory needs to be writable for Crack to work
#Tigris_CRACKDIR_LOC_OVERRIDE=/usr/local/crack
#
# Should we use canonical fully qualified domain names
# in the reports?
#
Tigris_Output_FQDN=Y
#
# Integrity checkers:
# Note: 
# - Make sure you don't run more than one integrity checker as it will 
# slow down checking drastically.
# - These checks are disabled since they are provided by the own programs
# when installing most integrity-checking programs (this is the default
# behaviour in Debian, for example)
#
# Run Tripwire file integrity checker
#
Tigris_Run_TRIPW=N		# Slow
#
# Custom Tripwire binary location (like read-only media)
# This can be a generic location which can be overriden by the site
# configuration file.
#Tigris_TRIPW_LOC_OVERRIDE=/mnt/cdrom/tripw/tripwire
#
# Run Aide file integrity checker
Tigris_Run_AIDE=N                # Slow
# Verbose reporting (not implemented yet)
#Tigris_Run_AIDE_VERBOSE=1
#
# The options below are usefull if you use custom settings.
# These can be a generic location which can be overriden by the site
# configuration file.
# Custom Aide location (like read-only media)
#Tigris_AIDE_LOC_OVERRIDE=/mnt/cdrom/aide/aide.bin
# Custom Aide configuration file (say, read-only media)
#Tigris_AIDE_CFG_OVERRIDE=/mnt/cdrom/aide/aide.conf
# Custom database (for instance in read-only media)
#Tigris_AIDE_DB_OVERRIDE=/mnt/cdrom/aide/in.db
# Custom getfacl location, for the ACL leg of check_storage
#Tigris_Getfacl=/usr/bin/getfacl
#
# I think there are enough hints to best practices like storing
# crucial data ON READ-ONLY MEDIA.
#
# Run Integrit file integrity checker
Tigris_Run_INTEGRIT=N                # Slow
Tigris_INTEGRIT_CFG=/etc/integrit/integrit.conf
#
# Custom Integrit location (like read-only media)
#Tigris_INTEGRIT_LOC_OVERRIDE=/mnt/cdrom/integrit/integrit.bin


# Line size (for formatting of output)... default is 79...
# Specifying '0' means unlimited
#
Tigris_Output_Width=79
#
# Same as above, except used when run via 'tigercron'...
# You should set this once and never change it, 'cause if you
# change it, you'll get lots and lots of new stuff according
# to the scripts (the diff's against previous reports will find
# lots of changes due to the formatting changes).
#
Tigris_CRON_Output_Width=0
#
# Global places to confirm some type of default PATH setting.
# A simple space delimited list
#
Tigris_Global_PATH="/etc/profile /etc/csh.login"
#
# What password aging/constraints to check for.
# A simple space delimited list.
Tigris_Passwd_Constraints="PASS_MIN_DAYS PASS_MAX_DAYS PASS_WARN_AGE PASS_MIN_LEN"
#
# Acceptable password hashes.
# List of password hashes separated by '|'... no whitespaces
#
# Number of days of non-modified files in the home directory for a user
# to be considered dormant (setting = 0 disables this check)
Tigris_Dormant_Limit=60
#
# What accounts are considered administrative (beyond root)
# (likely to not be used by humans, and therefore have impossible passwords)
# List of usernames separated by '|'... no whitespaces
Tigris_Admin_Accounts='adm|bin|daemon|games|lp|mail|news|operator|sync|sys|uucp|man|proxy|majordom|postgres|www-data|operator|irc|gnats'
#
# If an embedded pathname refers to an executable file, this executable
# will in turn be checked.  This will continue "recursively" until
# either no new executables are found, or a maximum reference depth
# is reached.  Setting this variable to 0 is equivalent to infinity.
# On a Sun 4/490, SunOS 4.1.2, 6GB disk, an infinite depth check
# took about 30 minutes.  Your milage will vary.
#
# On small memory systems, a large search depth can result in out
# of memory situations for 'sort'... :-(...
#
Tigris_Embed_Max_Depth=3
#
# Only search executables for embedded pathnames.  If this is
# set to 'N', then all regular files will be searched.  Otherwise
# only executable files will be searched.
#
Tigris_Embed_Check_Exec_Only=Y
#
# Check all setuid executables found.  This will cause 'tiger'
# to run longer on many systems, as it will have to wait for the
# file system scans to complete before it can begin checking the
# embedded pathnames.
#
Tigris_Embed_Check_SUID=Y
#
# Only report executables which are writable or not owned by root.  If set
# to 'Y' only the executables will be reported.  Any other value will result
# in regular files and directories being reported as well.
#
# Note that currently, device files are never reported.
#
Tigris_Embed_Report_Exec_Only=Y
#
# Who do you allow to own system files.
# List of usernames separated by '|'... no whitespace
#
Tigris_Embedded_OK_Owners='root|bin|uucp|sys|daemon'
#Tigris_Embedded_OK_Owners=root
#
# What groups can have write access to system files?
# List of group names separated by '|'... no whitespace.
# No value means no groups should have write access.
#
Tigris_Embedded_OK_Group_Write='root|bin|uucp|sys|daemon'
#
# Should all users' PATH variables be checked.  This has the potential
# of being dangerous because of the way it is done.  You might want to
# take a look at check_path and decide for yourself whether the precautions
# are sufficient before enabling this.
#
Tigris_Check_PATHALL=N           # Check all user PATHs in startup files.
#
# Who can own executables in 'root's PATH?
# List of usernames separated by '|'... no whitespace
#
Tigris_ROOT_PATH_OK_Owners='root|uucp|bin|news|sys|daemon'
# If you are paranoid:
#Tigris_ROOT_PATH_OK_Owners='root'
# If you are running HP-UX
# Tigris_ROOT_PATH_OK_Owners='root|uucp|bin|news|sys|daemon|lp'
#
# What groups can have write access to executables in 'root's PATH?
# List of group names separated by '|'... no whitespace.
# No value means no groups should have write access.
#
Tigris_ROOT_PATH_OK_Group_Write='root|uucp|bin|sys|daemon'
#
# Who can own things in other users PATH?
# List of usernames separated by '|'... no whitespace
#
Tigris_PATH_OK_Owners=$Tigris_ROOT_PATH_OK_Owners
#
# What groups can have write access to executables in non-root user PATH?
# List of group names separated by '|'... no whitespace.
# No value means no groups should have write access.
#
eval Tigris_PATH_OK_Group_Write='$Tigris_ROOT_PATH_OK_Group_Write'
#
# Should 'tiger' wait for Crack to finish?  If set to 'Y' it will wait
# until it finishes.  If set to 'N', it will collect the output if
# Crack finishes before the rest of the checks.  If it isn't finished
# 'tiger' will simply report where the output will be stored.
#
Tigris_Collect_CRACK=Y
#
# Run Crack on local password sources only?  If set to Y, no network
# sources will be used.  If set to 'N', NIS, NIS+, NetInfo, etc
# sources will also be used.
#
Tigris_Crack_Local=Y
#
# Who sends output from 'tigercron'?
# Default is "root@$HOSTNAME" (gets expanded by tigercron)
#
# Tigris_Mail_FROM="root@`uname -n`"
#
# Who gets output from 'tigercron'?
#
Tigris_Mail_RCPT=root
#
# List of '/' separated filename globs (NOT pathnames) to look for
# on the filesystems.
#
Tigris_Files_of_Note="..[!.]*/.* */.*	*/.[!.]/.log/.FSP*"
#
# File system scan - things to look for
#
Tigris_FSScan_Setuid=Y		# Setuid executables
Tigris_FSScan_Setgid=Y		# Setgid executables
Tigris_FSScan_Devs=Y		# device files
Tigris_FSScan_SymLinks=Y		# strange symbolic links
Tigris_FSScan_ofNote=Y		# weird filenames
Tigris_FSScan_WDIR=Y		# world writable directories
Tigris_FSScan_WFILE=Y		# world writable files
Tigris_FSScan_Unowned=Y		# files with undefined owners/groups
#  The following variables change the way the GET_MOUNTS (gen_mounts) script works:
Tigris_FSScan_WarnUnknown=Y	# Warn about unknown filesystems used
Tigris_FSScan_Local=''		# Filesystems considered to be local to the system, pipe-separated
Tigris_FSScan_NonLocal=''	# Filesystems considered to be non-local to the system, pipe-separated
#
# Should we scan read-only filesystems
#
Tigris_FSScan_ReadOnly=N
#
# Directories the file system scan should skip, pipe-separated.
# Each entry is a find -path pattern, e.g. '/srv/backups|/home/*/.cache'
#
# The default skips the stores that hold container images (rootless
# Podman's too, in each home), Flatpak runtimes and snaps. Their symlinks
# resolve inside their own root, not on the host, and on a desktop they
# produced 16,000 dangling-symlink warnings in a run; a rootless image's
# setuid programs, owned by the user its root maps to, each came out as
# non-standard and not owned by an administrator. Set it to '' to scan
# them too.
#
Tigris_FSScan_PruneDirs='/var/lib/flatpak|/var/lib/docker|/var/lib/containerd|/var/lib/containers|/home/*/.local/share/containers|/root/.local/share/containers|/var/lib/snapd|/var/snap|/snap'
#
# Where the filesystem scan lists its oddities one by one: pipe-separated
# path prefixes. In these directories a dangling symlink can be a path a
# privileged program follows into somewhere another user can create, a
# file with a strange name is worth a look, and a world-writable file is
# one anyone can make root, a server or a daemon read what they like.
# Elsewhere (help files, icon themes, home directories, copies of other
# machines' disks) dangling symlinks, odd names and world-writable files
# (a tool's lock or cache file, as often as not) are routine, so they are
# counted per directory instead. Set to '*' to list everything.
#
Tigris_FSScan_DetailDirs='/etc|/bin|/sbin|/lib|/usr/bin|/usr/sbin|/usr/lib|/usr/local|/opt|/boot|/root|/var/lib|/var/spool|/srv'
#
# The sysctl check reads $Tigris_Sysctl_Root/proc/sys. Empty means this
# system; the tests point it at a tree of their own.
#
Tigris_Sysctl_Root=''
#
# Seconds to wait for a filesystem to answer before a check leaves it
# alone. A hard NFS or CIFS mount whose server is down blocks every
# program that touches it; the filesystem scan, the account checks and
# the PATH checks ask first (df -P under a kill timeout) and report what
# they skipped (con011c, acc025w, path010w). Needs a 'timeout' command
# (coreutils or busybox); without one there is no limit, as before.
# Tigris_Mount_Probe_Cmd replaces df; the tests point it at a script.
# Tigris_Csrutil_Cmd replaces `csrutil status' and Tigris_Fdesetup_Cmd
# replaces `fdesetup status' (both macOS only); the tests point them
# at fixture scripts. Tigris_Brew_Cmd replaces `brew --prefix',
# Tigris_Pfctl_Cmd `pfctl -s info' and Tigris_Appfw_Cmd
# `socketfilterfw --getglobalstate' (both macOS only) the same way.
# Tigris_Dscl_Cmd replaces dscl for the macOS account checks.
#
Tigris_Mount_Timeout=5
Tigris_Csrutil_Cmd=''
Tigris_Fdesetup_Cmd=''
Tigris_Brew_Cmd=''
Tigris_Pfctl_Cmd=''
Tigris_Appfw_Cmd=''
Tigris_Dscl_Cmd=''
# Tigris_Ipfw_Cmd points ipfw at a stub, Tigris_Ifconfig_Cmd ifconfig -a
# (both FreeBSD only), for the suites.
Tigris_Ipfw_Cmd=''
Tigris_Ifconfig_Cmd=''
# Tigris_Pkg_Cmd points pkg at a stub, for the suites.
Tigris_Pkg_Cmd=''
# Tigris_Uname_Cmd points uname at a stub, for the hostinfo suite.
Tigris_Uname_Cmd=''
Tigris_Mount_Probe_Cmd=''
#
# Write the findings as JSON Lines as well, one object per finding, in a
# .jsonl file next to the text report. A run record comes first and a
# summary with counts last. INFO findings are always included there.
#
Tigris_Output_JSON=Y
#
# List of dot files commonly found in user home directories.  These
# will be checked by check_accounts for proper access permissions.
#
USERDOTFILES=".alias .kshrc .cshrc .profile .login .mailrc .exrc .emacs .forward .tcshrc .zshenv .zshrc .zlogin .zprofile .rcrc .bashrc .bash_profile .inputrc .xinitrc .fvwm2rc .Xsession .Xclients .less"
#
# What uid's should not give warnings about valid shells 
# (trusted or default users)
# Debian GNU/Linux: default is 999, users are generated over 1000
# Solaris: default should be 99, users are generated over 100
# HP-UX (?): default should be 499, users are generated over 500
Tigris_Accounts_Trust=999
#
# These SSH directive variables are used to specify "allowed" values
# for the SSH Daemon.
# Multiple options are seperated by '|', and directive variable can
# be left blank to ignore the check.
Tigris_SSH_Protocol='2'
Tigris_SSH_RhostsAuthentication='no'
Tigris_SSH_PasswordAuthentication='no'
#
# Should we give warnings on services that listen on all interfaces?
# (i.e. those that have not been configured to listen only on one)
# This is useful in servers which might add new interfaces (and thus
# services will be unexpectedly be offered in them too) or to catch
# "rogue" services
Tigris_Listening_Every=Y
#
# Which *user* do you allow to have processes listening for incoming connections 
# on the system?
# List of usernames separated by '|'... no whitespaces allowed (but wildcards are)
#
Tigris_Listening_ValidUsers='root'
#
# Which processes are always considered valid, regardless of how are they
# listening for incoming connections on the system?
# This allows administrators to disable warnings on processes that might change
# the listening port dynamically (and thus cannot be removed through the 
# template definitions)
# List of processes separated by '|'... no whitespaces allowed (but wildcards are)
#
Tigris_Listening_ValidProcs=''
#
# Is USB storage forbidden here? With Y, check_storage reports (stor008w)
# when the usb-storage driver is neither blacklisted nor replaced in
# /etc/modprobe.d. The default leaves USB storage alone.
#
Tigris_Storage_NoUSB=N
Tigris_Storage_NoFireWire=N
#
# Which processess should be checked for by Tiger?
# Processes in this list (separated by whitespaces) which are not
# seen in the process table will generate a FAIL:
#
# The process list below is just an example (useful for Linux)
# change it to suit your needs. You can use either the process name
# or the full path name
Tigris_Running_Procs='syslogd cron atd klogd'
# or
# Tigris_Running_Procs='/sbin/syslogd /usr/sbin/atd /usr/sbin/cron /sbin/klogd'
#
# Should we optimize DPKG checks? (by not using dpkg but looking on
# the file database at /var/lib/dpkg?)
#
Tigris_DPKG_Optimize=Y
# 
# Other applications:
# 
# Arguments used in the command line for chkrootkit. If you are using
# NFS filesystems you might want to add '-n' here too. '-q' makes the 
# chkrootkit process work in 'quiet' mode.
Tigris_CHKROOTKIT_ARGS="-q"
#
